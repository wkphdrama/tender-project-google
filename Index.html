<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: "Microsoft JhengHei", Arial, sans-serif; margin: 24px; color:#222; }
    h2 { margin-bottom: 4px; }
    #setupBox { background:#f5f5f5; padding:16px; border-radius:8px; max-width:420px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 8px; font-size: 13px; text-align:left; }
    th { background: #f0f0f0; }
    input { padding: 6px 8px; }
    button { padding: 6px 12px; cursor:pointer; margin: 2px; }
    .form-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .form-row input { flex: 1; min-width: 120px; }
    #msg { color: #c0392b; margin: 8px 0; min-height: 1.2em; }
    #whoami { color:#555; font-size: 13px; }
    .badge-latest { background:#2ecc71; color:#fff; padding:2px 6px; border-radius:4px; font-size:12px; }
    .badge-old { color:#999; font-size:12px; }
    .hint { color:#888; font-size:12px; margin-bottom:12px; }
    .record-table td {
      white-space: pre-wrap;
      word-break: break-word; /* 避免長英文單字或網址把欄位撐太寬 */
     }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
  <link href="https://unpkg.com/tabulator-tables@6.5.0/dist/css/tabulator.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.5.0/dist/js/tabulator.min.js"></script>
</head>
<body>
  <div class="container-fluid">
   
    <div class="row" id="loading" style="display:block;">
        <H1>Loading...</H1>
    </div>
    <div class="row" id="setupBox" style="display:none;">
      <p>第一次使用,請輸入你在「承辦人」欄位中對應的姓名:</p>
      <input id="handlerNameInput" placeholder="例如: 王小明">
      <button onclick="saveHandlerName()">確認</button>
    </div>

    <div class="row" id="mainBox" style="display:none;">
      <h2>我的計畫紀錄</h2>
      <p id="whoami"></p>
      <p class="hint">每次送出都是「新增一筆紀錄」,不會覆蓋舊資料。若要修改某個計畫,直接重新填一次表單送出即可,系統會自動把最新的一筆標記為「最新」。</p>
      <div id="msg"></div>
      <div class="modal" id="inputModal" tabindex="-1">
        <div class="modal-dialog modal-xl" >
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="formTitle">新增 / 更新一筆紀錄</h3>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="form-row">
              <input class="form-control" id="planName" placeholder="購案名稱">
              <input class="form-control" id="contractor" placeholder="承攬廠商">
              <input class="form-control" id="contectName" placeholder="聯絡人"> 
              <input class="form-control" id="startDate" type="date">
              <input class="form-control" id="endDate" type="date">
              <input class="form-control" id="amount" placeholder="金額" type="number">  
              <input class="form-control" id="planNo" placeholder="採購案號">
              <input class="form-control" id="remark" placeholder="備註">
              <select id="status">
                  <option value="規劃" selected>規劃</option>
                  <option value="發案">發案</option>
                  <option value="執行">執行</option>
                  <option value="結案">結案</option>
              </select>
            </div>
            <div class="form-row">
                <span>付款期數:</span>
                <select id="paytimes">
                  <option value="1" selected>1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                </select>
                <span>剩餘金額</span>
                <span id="lastAmount"></span>
                
            </div>
            <div class="form-row">
               <div id="payinfo">
                </div>
            </div>  
            <div class="form-row">
                <span>外部支應期數:</span>
                <select id="other_paytimes">
                  <option value="0" selected>0</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                </select>
                
            </div>
            <div class="form-row">
               <div id="other_payinfo">
                </div>
            </div>  
            <div class="form-row">
                <input class="form-control" id="otherPlan" placeholder="經費分擔計畫"> 
                <input class="form-control" id="otherAmount" placeholder="分攤經費" type="number"> 
            </div>  
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" onclick="submitRecord()">送出(新增一筆)</button>
            <button type="button" class="btn btn-primary" onclick="resetForm()">清空表單</button>
          </div>  
        </div>
        </div>    
      </div> 
      <div class="row">
        <div class="col">
          <button type="button" class="btn btn-primary" onclick="addnew()" >新增</button>
          <table id="recordTable" class="record-table">
            <thead>
              <tr>
                <th>購案名稱</th><th>承攬廠商</th><th>聯絡人</th><th>開案日期</th><th>結案日期</th><th>金額(千元)</th><th>分配(金額__比例__日期)</th><th>類型</th><th>經費分擔計畫</th><th>分攤經費</th><th>採購案號</th><th>備註</th><th>狀態</th><th>更新日期</th><th>功能</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <hr>
        </div>
      </div>
      <div class="row search" >
        <div class="col">
             <h5 id="formTitle">搜尋</h3>
            <span>搜尋年分(西元)</span><input class="" id="selectyr">
            <button type="button" class="btn btn-primary" onclick="search()" >search</button>
        </div>
      </div>
      <div class="row search">
        <div class="col">
          <table id="yearTable" class="record-table">
            <thead>
              <tr>
                <th>購案名稱</th><th>開案日期</th><th>結案日期</th><th>合計金額(千元)</th><th>分配</th><th>分攤計畫</th><th>備註</th><th>狀態</th><th>1月</th><th>2月</th><th>3月</th><th>4月</th><th>5月</th><th>6月</th><th>7月</th><th>8月</th><th>9月</th><th>10月</th><th>11月</th><th>12月</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
  </div>

<script>
  const inputmodal = bootstrap.Modal.getOrCreateInstance(
      document.getElementById('inputModal')
  );

  function init() {
    document.getElementById('loading').style.display = 'block';
    google.script.run.withSuccessHandler(function(user) {
      if (!user.handlerName) {
        document.getElementById('setupBox').style.display = 'block';
        document.getElementById('mainBox').style.display = 'none';
      } else {
        document.getElementById('setupBox').style.display = 'none';
        document.getElementById('mainBox').style.display = 'block';
        document.getElementById('whoami').innerText = '目前身分: ' + user.handlerName + '(' + user.email + ')';
        window._user = user.handlerName;
        document.getElementById('loading').style.display = 'none';
        loadRecords();
      }
    }).withFailureHandler(showErr).getCurrentUser();
    //document.getElementById('loading').style.display = 'none';
  }

  function saveHandlerName() {
    const name = document.getElementById('handlerNameInput').value.trim();
    if (!name) return;
    google.script.run.withSuccessHandler(init).withFailureHandler(showErr).setHandlerName(name);
  }

  function loadRecords() {
    document.getElementById('loading').style.display = 'block';
    google.script.run.withSuccessHandler(renderTable).withFailureHandler(showErr).getMyRecords();
    inputmodal.hide();
   
  }
  function addnew(){
      resetForm();
      inputmodal.show();
  }



  function renderTable(records) {
    window._records = records;
    const tbody = document.querySelector('#recordTable tbody');
    tbody.innerHTML = '';
    
    records.forEach((r, idx) => {
      const tr = document.createElement('tr');
      const statusHtml = r.status === '結案'
        ? '<span class="badge-old">'+escapeHtml(r.status)+'</span>'
        : '<span class="badge-latest">'+escapeHtml(r.status)+'</span>';
      tr.innerHTML =
        '<td>' + escapeHtml(r.planName) + '</td>' +
        '<td>' + escapeHtml(r.contractor) + '</td>' +
        '<td>' + escapeHtml(r.contectName) + '</td>' +
        '<td>' + escapeHtml(r.startDate) + '</td>' +
        '<td>' + escapeHtml(r.endDate) + '</td>' +
        '<td>' + escapeHtml(String(r.amount)) + '</td>' +
        '<td>' + escapeHtml(r.yrAmount) + '</td>' +
        '<td>' + r.planType+ '</td>' +
        '<td>' + escapeHtml(r.otherPlan) + '</td>' +
        '<td>' + escapeHtml(r.otherAmount) + '</td>' +
        '<td>' + escapeHtml(r.planNo) + '</td>' +
        '<td>' + escapeHtml(r.remark) + '</td>'+ 
        '<td>' + statusHtml + '</td>'+       
        '<td>' + escapeHtml(r.timestamp) + '</td>' ;
      if(r.status != '結案'){
        tr.innerHTML += '<td><button onclick="reuseRecord(' + idx + ')">修改</button></td>';
      }
      tbody.appendChild(tr);
    });
    document.getElementById('loading').style.display = 'none';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  // 把某一筆歷史紀錄的內容帶入表單,方便修改後「再新增一筆」,不會直接改到原本的列
  function reuseRecord(idx) {
    inputmodal.show();
    const r = window._records[idx];
    if (!r) return;
    document.getElementById('formTitle').innerText = '更新「' + r.planName + '」(送出後會新增一筆最新紀錄)';
    document.getElementById('planName').value = r.planName;
    document.getElementById('contractor').value = r.contractor;
    document.getElementById('contectName').value = r.contectName;
    document.getElementById('amount').value = r.amount;
    document.getElementById('startDate').value = r.startDate;
    document.getElementById('endDate').value = r.endDate;
    
    document.getElementById('otherPlan').value = r.otherPlan;
    document.getElementById('otherAmount').value = r.otherAmount;
    document.getElementById('planNo').value = r.planNo;
    document.getElementById('remark').value = r.remark;
    document.getElementById('status').value = r.status;

    str2payform(r.yrAmount);
  }



  function removeRecord(idx) {
    google.script.run.withSuccessHandler(loadRecords).withFailureHandler(showErr).removeRecords(idx);
  }

  function resetForm() {
    document.getElementById('formTitle').innerText = '新增 / 更新一筆紀錄';
    var formkey = ['planName','contractor','contectName', 'startDate','endDate','amount','otherPlan','otherAmount','planNo','remark','status'];
    formkey.forEach(id => document.getElementById(id).value = '');
    document.getElementById('paytimes').value = '1';
    document.getElementById('paytimes').dispatchEvent(new Event('change')); // 觸發事件

  }

  function payform2str(){
    const count = parseInt( document.getElementById('paytimes').value, 10);
    let   paystr = '';
    for (let idx = 0; idx < count; idx++){
       const amount = document.querySelector(`.amount-input[data-index="${idx}"]`).value;
       const ratio = document.querySelector(`.ratio-input[data-index="${idx}"]`).value;       
       const date = document.querySelector(`.date-input[data-index="${idx}"]`).value;
       if (idx==0){
         paystr = amount+'__'+ratio.padStart(2, '0')+'__'+date;  
       }
       else{
         paystr += '\n'+amount+'__'+ratio.padStart(2, '0')+'__'+date;
       }
       

    }
    return paystr
  }

  function search(){
    const yr = document.getElementById('selectyr').value;
    google.script.run.withSuccessHandler(showsearch).withFailureHandler(showErr).searchMasteryr(yr);
  }

  function showsearch(records){
    window._searchRecords = records;
    const tbody = document.querySelector('#yearTable tbody');
    tbody.innerHTML = '';
    
    records.forEach((r, idx) => {
      const tr = document.createElement('tr');
      
      tr.innerHTML =
        '<td>' + escapeHtml(r.planName) + '</td>' +
        '<td>' + escapeHtml(r.startDate) + '</td>' +
        '<td>' + escapeHtml(r.endDate) + '</td>' +
        '<td>' + escapeHtml(String(r.amount)) + '</td>' +
        '<td>' + escapeHtml(r.yrAmount) + '</td>' +
        '<td>' + escapeHtml(r.otherPlan)+':'+escapeHtml(r.otherAmount) + '</td>' +
        '<td>' + escapeHtml(r.remark) + '</td>'+ 
        '<td>' + escapeHtml(r.status) + '</td>';      
      for (let i = 0 ; i < 12 ; i++){
        tr.innerHTML +='<td>' + escapeHtml(r.monthDetail[i]) + '</td>';
      }

      tbody.appendChild(tr);
    });
    document.getElementById('loading').style.display = 'none';
  
  }

  function str2payform(paystr){
    const paylist = paystr.split("\n");
    document.getElementById('paytimes').value = String(paylist.length);
    document.getElementById('paytimes').dispatchEvent(new Event('change')); // 觸發事件
    for (let idx = 0; idx < paylist.length; idx++){
        const payinfo = paylist[idx].split("__");
        document.querySelector(`.amount-input[data-index="${idx}"]`).value = payinfo[0];
        document.querySelector(`.ratio-input[data-index="${idx}"]`).value = payinfo[1];
        if(paylist[2] != ''){
          document.querySelector(`.date-input[data-index="${idx}"]`).value = payinfo[2];
        }
    }
    
  }

  function submitRecord() {
    
    
    var formkey = ['planName','contractor','contectName', 'startDate','endDate','amount','otherPlan','otherAmount','planNo','remark','status'];
    var record = {}
    formkey.forEach(id => record[id] = document.getElementById(id).value );
    record['yrAmount'] = payform2str();
    record['handler']= window._user;
    if( parseInt(document.getElementById('amount').value,10) >= 1500 ){
       record['planType']= '公告';
    }
    else{
       record['planType']= '';
    }
    if (!record.planName) {
      showMsg('請填寫計劃名');
      return;
    }
    showMsg('');
    document.getElementById('loading').style.display = 'block';
    google.script.run.withSuccessHandler(function() {
      resetForm();
      loadRecords();
    }).withFailureHandler(showErr).addRecord(record);
    
  }

  function showMsg(text) {
    document.getElementById('msg').innerText = text;
  }
  function showErr(err) {
    showMsg('錯誤: ' + err.message);
  }

  // 建立分期金額輸入的事件
  document.getElementById('paytimes').addEventListener('change', function () {
  const count = parseInt(this.value, 10) || 0;
  const container = document.getElementById('payinfo');
  container.innerHTML = ''; // 先清空舊的區塊

  for (let i = 0; i < count; i++) {
    const div = document.createElement('div');
    div.className = 'form-payinfo';
    div.innerHTML = `
      <span>第 ${i + 1} 期</span>
      <input type="number" class="ratio-input" data-index="${i}" placeholder="比例(%)" step="0.01">
      <input type="number" class="amount-input" data-index="${i}" placeholder="金額" step="1">
      <span>執行日期</span>
      <input type="date" class="date-input" data-index="${i}">
    `;
    container.appendChild(div);
  }

  bindLinkedInputs(); // 每次重新產生後,要重新綁定連動事件
});

// 綁定「比例 ↔ 金額」的雙向連動
function bindLinkedInputs() {
  document.querySelectorAll('.ratio-input').forEach(ratioInput => {
    ratioInput.addEventListener('input', function () {
      const idx = this.dataset.index;
      const totalAmount = parseInt( document.getElementById('amount').value,10) || 0;
      const amountInput = document.querySelector(`.amount-input[data-index="${idx}"]`);
      const ratio = parseFloat(this.value);
      if (!isNaN(ratio)) {
        amountInput.value = (totalAmount * ratio / 100).toFixed(3);
      }
    });
  });

  document.querySelectorAll('.amount-input').forEach(amountInput => {
    amountInput.addEventListener('input', function () {
      const idx = this.dataset.index;
      const totalAmount = parseInt( document.getElementById('amount').value,10) || 0;
      const amountInput = document.querySelector(`.amount-input[data-index="${idx}"]`);
      const ratioInput = document.querySelector(`.ratio-input[data-index="${idx}"]`);
      const amount = parseFloat(this.value);
      if (!isNaN(amount) && totalAmount > 0) {
        ratioInput.value = (amount / totalAmount * 100).toFixed(1);
      }
    });
  });
}



  init();
</script>
</body>
</html>
